<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pottu</title><link rel="stylesheet" href="style.css"></head><body><main><section id="lobby" class="panel"><h1>♠ Pottu</h1><p>Four-player card game</p><input id="name" maxlength="24" placeholder="Your name"><div><button id="create">Create room</button><input id="code" maxlength="4" placeholder="Room code"><button id="join">Join room</button></div><p id="lobbyNote"></p></section><section id="game" hidden><header class="gamebar"><button class="table-button">☰ <span>Table</span></button><div class="match-title">POTTU <small id="room"></small></div><div class="game-icons">♛ &nbsp; ☰</div></header><div id="notice"></div><div id="table"><div class="seat top" data-pos="top"></div><div class="seat left" data-pos="left"></div><div class="centre"><div id="status"></div><div id="tricks"></div><div id="cardsOnTable"></div><div id="choose" hidden><span>Choose Cheppudu</span><button data-suit="♠">♠</button><button data-suit="♥">♥</button><button data-suit="♦">♦</button><button data-suit="♣">♣</button></div></div><div class="seat right" data-pos="right"></div><div class="seat bottom" data-pos="bottom"></div></div><section id="controls"><button id="sortRank">Sort rank</button><button id="sortSuit">Sort suit</button></section><section class="rack"><div id="hand" class="hand"></div></section></section></main><script src="/socket.io/socket.io.js"></script><script src="app.js"></script></body></html>
